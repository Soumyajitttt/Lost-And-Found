<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="header">
        <nav class="header-nav">
            <div class="logo"><a id="logo-link" href="index.html">Lost & Found</a></div>
            <div id="nav-links"></div>
        </nav>
    </header>

    <main class="container">
        <div class="dashboard-header">
            <h1>Admin Dashboard</h1>
            <p class="subtitle">Welcome! Here's an overview of the platform activity.</p>
        </div>

        <!-- Stat Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-archive"></i></div>
                <div class="stat-info">
                    <span class="stat-title">Total Items</span>
                    <span class="stat-value" id="total-items-stat">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-search"></i></div>
                <div class="stat-info">
                    <span class="stat-title">Lost Items</span>
                    <span class="stat-value" id="lost-items-stat">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-hand-holding-heart"></i></div>
                <div class="stat-info">
                    <span class="stat-title">Found Items</span>
                    <span class="stat-value" id="found-items-stat">0</span>
                </div>
            </div>
             <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-link"></i></div>
                <div class="stat-info">
                    <span class="stat-title">Items with Matches</span>
                    <span class="stat-value" id="matches-stat">0</span>
                </div>
            </div>
        </div>

        <div id="error-msg"></div>

        <!-- Dashboard Panels -->
        <div class="dashboard-main">
            <div class="dashboard-panel">
                <div class="panel-header">
                    <h2>Recent Submissions</h2>
                    <a href="all-items.html" class="view-all-link">View All &rarr;</a>
                </div>
                <div class="panel-content" id="recent-items-list">
                    <!-- JS will populate this -->
                </div>
            </div>
            <div class="dashboard-panel">
                 <div class="panel-header">
                    <h2>Lost Items with Matches</h2>
                    <a href="lost-items.html" class="view-all-link">View All &rarr;</a>
                </div>
                <div class="panel-content" id="matching-items-list">
                    <!-- JS will populate this -->
                </div>
            </div>
        </div>

    </main>

    <script type="module" src="js/admin-dashboard.js"></script>
</body>
</html>
